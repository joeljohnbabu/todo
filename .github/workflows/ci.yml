name: Todo App CI

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Docker image tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "IMAGE_TAG=${GITHUB_REF_NAME}-${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: docker build -f backend/Dockerfile -t "${{ vars.DOCKERHUB_USERNAME }}/todo-backend:${IMAGE_TAG}" backend

      - name: Push Docker image
        run: docker push "${{ vars.DOCKERHUB_USERNAME }}/todo-backend:${IMAGE_TAG}"
